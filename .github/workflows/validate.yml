name: Alfred framework gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  framework:
    name: framework (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Canonical framework gate
        run: python scripts/validators/validate-framework.py
